<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYD Car Advisor - Find Your Perfect BYD in Malaysia</title>
    <style>
        :root {
            --byd-green: #2e7d32;
            --byd-green-light: #4caf50;
            --byd-dark: #1a1a2e;
            --byd-darker: #16213e;
            --byd-card: #0f3460;
            --text-light: #e0e0e0;
            --text-muted: #a0a0b0;
            --accent: #00d4ff;
            --accent-warm: #ff6b35;
            --bg-chat: #1e1e2e;
            --bubble-user: #1a3a5c;
            --bubble-bot: #2a2a3e;
            --border-subtle: #333355;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--byd-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .header {
            width: 100%;
            background: linear-gradient(135deg, var(--byd-darker) 0%, #1a1a3e 100%);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .header-logo {
            width: 48px;
            height: 48px;
            background: var(--byd-green);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .header-text h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 800px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            background: var(--bg-chat);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
            max-height: 60vh;
            min-height: 400px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 3px;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
            align-self: flex-end;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.bot .avatar {
            background: var(--byd-green);
        }

        .message.user .avatar {
            background: var(--accent-warm);
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.bot .bubble {
            background: var(--bubble-bot);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-subtle);
        }

        .message.user .bubble {
            background: var(--bubble-user);
            border-bottom-right-radius: 4px;
            border: 1px solid #2a5080;
        }

        .bubble strong {
            color: var(--accent);
        }

        .bubble em {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Buttons / Options */
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .option-btn {
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid var(--byd-green-light);
            background: rgba(76, 175, 80, 0.1);
            color: var(--byd-green-light);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .option-btn:hover {
            background: var(--byd-green);
            color: white;
            border-color: var(--byd-green);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }

        .option-btn.selected {
            background: var(--byd-green);
            color: white;
            border-color: var(--byd-green);
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 8px;
            background: var(--bg-chat);
            border-radius: 16px;
            padding: 8px;
            border: 1px solid var(--border-subtle);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 0.95rem;
            padding: 10px 12px;
            outline: none;
        }

        .input-area input::placeholder {
            color: var(--text-muted);
        }

        .input-area button {
            padding: 10px 24px;
            background: var(--byd-green);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .input-area button:hover {
            background: var(--byd-green-light);
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Recommendation Card */
        .rec-card {
            background: linear-gradient(135deg, #1a3a2a 0%, #1a2a3a 100%);
            border: 1px solid var(--byd-green);
            border-radius: 16px;
            padding: 20px;
            margin-top: 8px;
            animation: fadeIn 0.5s ease;
        }

        .rec-card h3 {
            color: var(--byd-green-light);
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .rec-card .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .rec-card .spec-row:last-child {
            border-bottom: none;
        }

        .spec-label {
            color: var(--text-muted);
        }

        .spec-value {
            font-weight: 600;
            color: var(--text-light);
        }

        .rec-card .why-tag {
            display: inline-block;
            background: rgba(76, 175, 80, 0.15);
            color: var(--byd-green-light);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin: 3px;
        }

        /* Variant badge */
        .variant-badge {
            display: inline-block;
            background: var(--accent-warm);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 6px;
        }

        /* Restart Button */
        .restart-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            align-self: center;
        }

        .restart-btn:hover {
            border-color: var(--accent-warm);
            color: var(--accent-warm);
        }

        /* Loading dots */
        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Price range bar */
        .price-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .price-bar .bar {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        .price-bar .bar-fill {
            height: 100%;
            background: var(--byd-green-light);
            border-radius: 3px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 8px; }
            .chat-container { padding: 12px; max-height: 55vh; }
            .bubble { max-width: 85%; font-size: 0.9rem; }
            .header-text h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-logo">⚡</div>
        <div class="header-text">
            <h1>BYD Car Advisor</h1>
            <p>🇲🇾 Find your perfect BYD electric car in Malaysia</p>
        </div>
    </div>

    <div class="container">
        <div class="chat-container" id="chatContainer">
            <!-- Messages appear here -->
        </div>

        <div class="input-area" id="inputArea">
            <input type="text" id="userInput" placeholder="Type your answer or click an option above..." />
            <button id="sendBtn" onclick="handleSend()">Send</button>
        </div>

        <button class="restart-btn" onclick="restartChat()">🔄 Start Over</button>
    </div>

    <script>
        // ============ DATA ============
        const BYD_CARS = [];

        // Load car data
        fetch('byd_cars.json')
            .then(res => res.json())
            .then(data => {
                BYD_CARS.push(...data.models);
                initChat();
            })
            .catch(err => {
                console.error('Failed to load car data:', err);
                document.getElementById('chatContainer').innerHTML =
                    '<div class="message bot"><div class="avatar">⚡</div><div class="bubble">❌ <strong>Error:</strong> Could not load BYD car data. Please ensure <code>byd_cars.json</code> is in the same folder.</div></div>';
            });

        // ============ CHAT STATE ============
        let chatState = {
            step: 0,
            answers: {},
            questions: [
                {
                    id: 'primary_use',
                    text: "First, tell me about your lifestyle! What will you <strong>mainly</strong> use your BYD for?",
                    options: [
                        { label: '🏙️ Daily City Commute', value: 'city' },
                        { label: '👨‍👩‍👧‍👦 Family & Errands', value: 'family' },
                        { label: '🛣️ Long Distance / Highway', value: 'long_distance' },
                        { label: '🏎️ Performance & Fun', value: 'performance' },
                        { label: '💼 Business / Executive', value: 'business' }
                    ]
                },
                {
                    id: 'passengers',
                    text: "How many passengers do you <strong>typically</strong> carry?",
                    options: [
                        { label: '1-2 (mostly solo/couple)', value: '1-2' },
                        { label: '3-4 (small family)', value: '3-4' },
                        { label: '5-6 (bigger family)', value: '5-6' },
                        { label: '7 (need all 7 seats!)', value: '7' }
                    ]
                },
                {
                    id: 'budget',
                    text: "What's your <strong>budget range</strong> for your new BYD?",
                    options: [
                        { label: '💰 RM 100K - 115K', value: '100k-115k' },
                        { label: '💵 RM 115K - 140K', value: '115k-140k' },
                        { label: '💎 RM 140K - 175K', value: '140k-175k' },
                        { label: '👑 RM 175K - 200K', value: '175k-200k' },
                        { label: '🤷 No strict budget', value: 'any' }
                    ]
                },
                {
                    id: 'priority',
                    text: "What matters <strong>most</strong> to you in a car?",
                    options: [
                        { label: '🔋 Long Range / Efficiency', value: 'range' },
                        { label: '⚡ Performance & Speed', value: 'performance' },
                        { label: '📦 Space & Practicality', value: 'space' },
                        { label: '💸 Value for Money', value: 'value' },
                        { label: '✨ Tech & Luxury Features', value: 'tech' }
                    ]
                },
                {
                    id: 'body_style',
                    text: "Do you have a <strong>body style</strong> preference?",
                    options: [
                        { label: '🚙 SUV / Crossover', value: 'suv' },
                        { label: '🚗 Sedan', value: 'sedan' },
                        { label: '🚐 MPV (7-seater)', value: 'mpv' },
                        { label: '🏎️ Hatchback', value: 'hatchback' },
                        { label: '🤷 No preference', value: 'any' }
                    ]
                }
            ]
        };

        // ============ CHAT FUNCTIONS ============
        function initChat() {
            chatState.step = 0;
            chatState.answers = {};
            document.getElementById('chatContainer').innerHTML = '';
            addBotMessage(
                '👋 <strong>Selamat datang!</strong> I\'m your BYD advisor for Malaysia. 🇲🇾<br><br>' +
                'I\'ll ask you a few quick questions about your lifestyle and preferences, then recommend the <strong>perfect BYD electric car</strong> for you!<br><br>' +
                '<em>Only models officially available in Malaysia are included. Let\'s go! ⚡</em>'
            );
            setTimeout(() => askQuestion(0), 800);
        }

        function addBotMessage(html) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message bot';
            div.innerHTML = `
                <div class="avatar">⚡</div>
                <div class="bubble">${html}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addUserMessage(text) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="avatar">👤</div>
                <div class="bubble">${text}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="avatar">⚡</div>
                <div class="bubble">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function askQuestion(index) {
            if (index >= chatState.questions.length) {
                showRecommendation();
                return;
            }

            chatState.step = index;
            const q = chatState.questions[index];

            let optionsHtml = '<div class="options">';
            q.options.forEach(opt => {
                optionsHtml +=
                    `<button class="option-btn" onclick="selectOption('${q.id}', '${opt.value}', '${opt.label.replace(/'/g, "\\'")}')">${opt.label}</button>`;
            });
            optionsHtml += '</div>';

            addBotMessage(`${q.text}<br>${optionsHtml}`);
        }

        function selectOption(questionId, value, label) {
            if (chatState.answers[questionId]) return; // Already answered

            chatState.answers[questionId] = { value, label };
            addUserMessage(label);

            // Disable options
            const lastBubble = document.querySelector('#chatContainer .message.bot:last-child .bubble');
            if (lastBubble) {
                const btns = lastBubble.querySelectorAll('.option-btn');
                btns.forEach(b => {
                    b.disabled = true;
                    if (b.textContent.trim() === label.trim()) {
                        b.classList.add('selected');
                    }
                });
            }

            setTimeout(() => askQuestion(chatState.step + 1), 500);
        }

        function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const currentQ = chatState.questions[chatState.step];
            if (!currentQ) return;

            addUserMessage(text);
            chatState.answers[currentQ.id] = { value: text.toLowerCase(), label: text };
            input.value = '';

            setTimeout(() => askQuestion(chatState.step + 1), 500);
        }

        // Allow Enter key to send
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSend();
        });

        // ============ RECOMMENDATION ENGINE ============
        function showRecommendation() {
            addTypingIndicator();

            setTimeout(() => {
                removeTypingIndicator();
                const rec = computeRecommendation();
                displayRecommendation(rec);
            }, 1200);
        }

        function computeRecommendation() {
            const a = chatState.answers;
            const scores = {};

            BYD_CARS.forEach(car => {
                let score = 0;
                const reasons = [];

                const minPrice = Math.min(...car.variants.map(v => v.price_myr));
                const maxPrice = Math.max(...car.variants.map(v => v.price_myr));

                // Primary use
                const use = a.primary_use?.value;
                if (use === 'city' && car.body_type === 'Hatchback') { score += 3; reasons.push('Compact & easy for city driving'); }
                if (use === 'city' && car.segment === 'B-Segment') { score += 2; reasons.push('B-Segment: nimble for urban roads'); }
                if (use === 'family' && car.body_type === 'MPV') { score += 5; reasons.push('7-seater MPV — ideal family hauler'); }
                if (use === 'family' && car.body_type === 'SUV' && car.segment === 'C-Segment') { score += 3; reasons.push('Spacious SUV for family needs'); }
                if (use === 'family' && car.dimensions?.seating >= 7) { score += 4; reasons.push(`${car.dimensions.seating} seats for the whole family`); }
                if (use === 'long_distance') {
                    const maxRange = Math.max(...car.variants.map(v => v.range_wltp_km || v.range_wltp_km_approx || 0));
                    if (maxRange >= 500) { score += 4; reasons.push(`Long WLTP range of ~${maxRange} km`); }
                    else if (maxRange >= 400) { score += 2; reasons.push(`Decent range of ~${maxRange} km WLTP`); }
                }
                if (use === 'performance') {
                    const bestAccel = Math.min(...car.variants.map(v => v.acceleration_0_100_kmh || 99));
                    if (bestAccel <= 4) { score += 5; reasons.push(`Blazing 0-100 km/h in ${bestAccel}s`); }
                    else if (bestAccel <= 6) { score += 3; reasons.push(`Quick 0-100 km/h in ${bestAccel}s`); }
                    else if (bestAccel <= 8) { score += 1; reasons.push(`Respectable 0-100 in ${bestAccel}s`); }
                }
                if (use === 'business') {
                    if (car.name.includes('Seal') && car.name.includes('7') === false && car.name.includes('6') === false) { score += 4; reasons.push('Premium executive sedan presence'); }
                    if (car.name.includes('Sealion')) { score += 3; reasons.push('Flagship SUV — executive appeal'); }
                    if (minPrice >= 170000) { score += 2; reasons.push('Premium price bracket'); }
                }

                // Passengers
                const pax = a.passengers?.value;
                if (pax === '7' && car.dimensions?.seating >= 7) { score += 5; reasons.push('Only BYD with 7 seats!'); }
                if (pax === '5-6' && car.body_type === 'MPV') { score += 3; reasons.push('MPV comfortably seats 5-6'); }
                if (pax === '5-6' && car.body_type === 'SUV' && car.segment === 'C-Segment') { score += 2; reasons.push('Spacious SUV for 5-6'); }
                if (pax === '3-4' && (car.body_type === 'SUV' || car.body_type === 'Sedan')) { score += 1; }
                if (pax === '1-2' && (car.body_type === 'Hatchback' || car.segment === 'B-Segment')) { score += 2; reasons.push('Perfect size for 1-2 people'); }

                // Budget
                const budget = a.budget?.value;
                if (budget === '100k-115k' && minPrice <= 115000) { score += 4; reasons.push('Within your budget range'); }
                if (budget === '115k-140k' && minPrice >= 115000 && maxPrice <= 140000) { score += 4; reasons.push('Fits your mid-range budget'); }
                if (budget === '140k-175k' && minPrice >= 140000 && maxPrice <= 175000) { score += 4; reasons.push('Matches your budget tier'); }
                if (budget === '175k-200k' && minPrice >= 170000) { score += 4; reasons.push('Premium budget match'); }
                if (budget === 'any' || !budget) { score += 1; }

                // Priority
                const priority = a.priority?.value;
                if (priority === 'range') {
                    const maxRange = Math.max(...car.variants.map(v => v.range_wltp_km || v.range_wltp_km_approx || 0));
                    if (maxRange >= 500) { score += 4; reasons.push(`Top range: ~${maxRange} km WLTP`); }
                    else if (maxRange >= 400) { score += 2; reasons.push(`Good range: ~${maxRange} km WLTP`); }
                }
                if (priority === 'performance') {
                    const bestAccel = Math.min(...car.variants.map(v => v.acceleration_0_100_kmh || 99));
                    if (bestAccel <= 4) { score += 5; reasons.push(`Serious performance: 0-100 in ${bestAccel}s`); }
                    else if (bestAccel <= 6) { score += 3; reasons.push(`Quick: 0-100 in ${bestAccel}s`); }
                }
                if (priority === 'space') {
                    if (car.body_type === 'MPV') { score += 5; reasons.push('Maximum space with 7 seats'); }
                    if (car.dimensions?.seating >= 7) { score += 4; }
                    if (car.body_type === 'SUV' && car.segment === 'C-Segment') { score += 3; reasons.push('Generous SUV cargo & passenger space'); }
                }
                if (priority === 'value') {
                    if (minPrice <= 110000) { score += 4; reasons.push(`Great value from RM ${minPrice.toLocaleString()}`); }
                    const rangePerRinggit = (Math.max(...car.variants.map(v => v.range_wltp_km || v.range_wltp_km_approx || 0))) / minPrice;
                    if (rangePerRinggit > 0.003) { score += 2; reasons.push('Excellent range-per-ringgit ratio'); }
                }
                if (priority === 'tech') {
                    const hasHighEnd = car.key_features?.some(f => f.toLowerCase().includes('dynaudio') || f.toLowerCase().includes('head-up') || f.toLowerCase().includes('nappa') || f.toLowerCase().includes('ar'));
                    if (hasHighEnd) { score += 4; reasons.push('Premium tech & luxury features'); }
                    if (car.key_features?.some(f => f.includes('800V'))) { score += 3; reasons.push('800V architecture for ultra-fast charging'); }
                }

                // Body style
                const body = a.body_style?.value;
                if (body === car.body_type.toLowerCase()) { score += 5; reasons.push(`Matches your ${car.body_type} preference`); }
                if (body === 'suv' && car.body_type === 'SUV') { score += 5; reasons.push('SUV as preferred'); }
                if (body === 'sedan' && car.body_type === 'Sedan') { score += 5; reasons.push('Sedan as preferred'); }
                if (body === 'mpv' && car.body_type === 'MPV') { score += 5; reasons.push('MPV as preferred'); }
                if (body === 'hatchback' && car.body_type === 'Hatchback') { score += 5; reasons.push('Hatchback as preferred'); }

                scores[car.name] = { score, reasons, car };
            });

            // Sort and return top 3
            const ranked = Object.values(scores).sort((a, b) => b.score - a.score);
            return ranked.slice(0, 3);
        }

        function displayRecommendation(rankings) {
            const top = rankings[0];
            const car = top.car;
            const bestVariant = car.variants[car.variants.length - 1]; // highest spec
            const entryVariant = car.variants[0];

            let html = `
                <div class="rec-card">
                    <h3>🏆 Your Perfect BYD: <strong>${car.name}</strong></h3>
                    <div style="margin-bottom:12px;">
                        <span style="color:var(--text-muted);">${car.body_type} · ${car.segment} · ${car.year_introduced}</span>
                    </div>
            `;

            // Why this car
            html += '<div style="margin-bottom:12px;">';
            top.reasons.forEach(r => {
                html += `<span class="why-tag">✅ ${r}</span> `;
            });
            html += '</div>';

            // Specs
            html += '<div style="margin-top:12px;">';
            html += `<div class="spec-row"><span class="spec-label">💰 Price Range</span><span class="spec-value">RM ${entryVariant.price_myr.toLocaleString()} – RM ${bestVariant.price_myr.toLocaleString()}</span></div>`;
            html += `<div class="spec-row"><span class="spec-label">🔋 Battery</span><span class="spec-value">${bestVariant.battery_capacity_kwh} kWh Blade LFP</span></div>`;
            html += `<div class="spec-row"><span class="spec-label">📏 Range (WLTP)</span><span class="spec-value">~${bestVariant.range_wltp_km || bestVariant.range_wltp_km_approx || bestVariant.range_nedc_km} km</span></div>`;
            html += `<div class="spec-row"><span class="spec-label">⚡ 0-100 km/h</span><span class="spec-value">${bestVariant.acceleration_0_100_kmh}s</span></div>`;
            html += `<div class="spec-row"><span class="spec-label">🛞 Drivetrain</span><span class="spec-value">${bestVariant.drivetrain} · ${bestVariant.motor_power_ps} PS / ${bestVariant.torque_nm} Nm</span></div>`;
            html += `<div class="spec-row"><span class="spec-label">📐 Dimensions</span><span class="spec-value">${car.dimensions.length_mm} × ${car.dimensions.width_mm} × ${car.dimensions.height_mm} mm</span></div>`;
            html += '</div>';

            // Variants
            html += '<div style="margin-top:12px;"><strong>Available Variants:</strong></div>';
            car.variants.forEach(v => {
                html +=
                    `<div class="spec-row"><span class="spec-label">  • ${v.name}</span><span class="spec-value">RM ${v.price_myr.toLocaleString()} — ${v.motor_power_ps} PS, ${v.range_wltp_km || v.range_wltp_km_approx || v.range_nedc_km} km</span></div>`;
            });

            // Warranty
            html += '<div style="margin-top:12px;"><strong>🛡️ Warranty:</strong></div>';
            html +=
                `<div class="spec-row"><span class="spec-label">  Vehicle</span><span class="spec-value">${car.warranty.vehicle}</span></div>`;
            html +=
                `<div class="spec-row"><span class="spec-label">  Battery</span><span class="spec-value">${car.warranty.battery}</span></div>`;

            html += '</div>';

            // Also consider
            if (rankings.length > 1) {
                html +=
                    '<div style="margin-top:16px; padding:12px; background:rgba(255,255,255,0.03); border-radius:12px;">';
                html += '<strong>🔄 Also consider:</strong><br>';
                for (let i = 1; i < rankings.length; i++) {
                    const r = rankings[i];
                    const rCar = r.car;
                    const rMinPrice = Math.min(...rCar.variants.map(v => v.price_myr));
                    const rMaxPrice = Math.max(...rCar.variants.map(v => v.price_myr));
                    html +=
                        `• <strong>${rCar.name}</strong> — ${rCar.body_type} · RM ${rMinPrice.toLocaleString()}–${rMaxPrice.toLocaleString()} <em>(${r.reasons.slice(0, 2).join('; ')})</em><br>`;
                }
                html += '</div>';
            }

            addBotMessage(html);
            addBotMessage(
                '🎉 That\'s my recommendation! All prices are for the Malaysian market 🇲🇾.<br><br>' +
                '<em>Want to start over? Click <strong>Start Over</strong> below, or ask me more about any model!</em>'
            );
        }

        function restartChat() {
            initChat();
        }
    </script>
</body>
</html>
