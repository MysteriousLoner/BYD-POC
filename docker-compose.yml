services:
  byd-website:
    build: ./website-with-chatbot
    container_name: byd-website
    ports:
      - "8082:3000"
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/runtime/byd.sqlite
      UPLOAD_DIR: /app/uploads
      SEED_DIR: /app/seed
    volumes:
      - byd-runtime:/app/runtime
      - byd-uploads:/app/uploads
      - ./website-with-chatbot/server/data:/app/seed:ro
    networks:
      - byd-network

networks:
  byd-network:
    driver: bridge

volumes:
  byd-runtime:
  byd-uploads:
